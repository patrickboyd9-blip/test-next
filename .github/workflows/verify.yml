name: verify

on:
  pull_request:
  push:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: print proof tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - name: tests
        run: |
          npx tsx --test $(find lib components -name '*.test.ts' -o -name '*.test.tsx')
          node --test scripts/check-pr-body.test.mjs
      - run: npm run build

  pull-request-notes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Requirement served, Manifesto check, and Customer experience
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: node scripts/check-pr-body.mjs
