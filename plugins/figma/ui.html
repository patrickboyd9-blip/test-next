<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Modern Mail</title>
  <style>
    body { margin: 0; font-family: Georgia, serif; background: #0c1424; color: #e7f2fb; }
    main { max-width: 360px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    h1 { font-size: 18px; margin: 0; }
    p, label { font-size: 13px; line-height: 1.4; color: #c5d4e4; }
    button, input, select { font: inherit; }
    button { min-height: 40px; border: 0; border-radius: 10px; background: #5ce1ff; color: #041018; font-weight: 600; }
    button.quiet { background: transparent; color: #5ce1ff; border: 1px solid #245068; }
    input, select { min-height: 40px; border-radius: 10px; border: 1px solid #245068; background: #071018; color: #e7f2fb; padding: 0 10px; }
    .warn { color: #ffd7a8; }
    .sheet { display: flex; gap: 8px; }
    .card { flex: 1; background: #f7fbff; color: #102033; border-radius: 6px; position: relative; overflow: hidden; }
    .card span { position: absolute; left: 6px; top: 4px; font-size: 10px; }
    .guide { position: absolute; border: 1px dashed #1d6f8a; }
    .hold { position: absolute; background: rgba(29, 111, 138, 0.16); border: 1px solid #1d6f8a; font-size: 8px; padding: 2px; }
  </style>
</head>
<body>
  <main>
    <h1>Modern Mail</h1>
    <p>Make the front and the back of a postcard, then send the print file to your campaign. Guides are not included in the file.</p>
    <label>Size
      <select id="size">
        <option value="5x8">5 × 8</option>
        <option value="6x9">6 × 9</option>
      </select>
    </label>
    <button id="create" type="button">Create front and back</button>
    <label>Modern Mail token
      <input id="token" type="password" autocomplete="off" />
    </label>
    <label>Campaign
      <select id="campaign">
        <option value="">New campaign</option>
      </select>
    </label>
    <button id="load" class="quiet" type="button">Load my campaigns</button>
    <label>Campaign name
      <input id="name" placeholder="Spring postcard" />
    </label>
    <label>Return business
      <input id="business" placeholder="Harbor Roofing" />
    </label>
    <label>Return street
      <input id="street" placeholder="1 Main St" />
    </label>
    <label>City
      <input id="city" placeholder="Austin" />
    </label>
    <label>State
      <input id="state" placeholder="TX" maxlength="2" />
    </label>
    <label>ZIP
      <input id="zip" placeholder="78701" />
    </label>
    <button id="send" type="button">Check and send</button>
    <p id="status"></p>
    <div id="preview" class="sheet" hidden></div>
  </main>
  <script>
    const status = document.getElementById("status")
    const parent = window.parent
    const SIZES = {
      "5x8": { w: 8.5, h: 5.5, trim: 0.25, panel: [265.5, 208], bar: [433, 46] },
      "6x9": { w: 9.5, h: 6.5, trim: 0.25, panel: [263, 213], bar: [432, 47] },
    }
    document.getElementById("load").onclick = loadCampaigns
    document.getElementById("create").onclick = () => {
      drawPreview(document.getElementById("size").value)
      parent.postMessage({ pluginMessage: { type: "create", size: document.getElementById("size").value } }, "*")
      status.textContent = "Creating the front and the back. Guides stay off the printed file."
    }
    function drawPreview(id) {
      const spec = SIZES[id]
      const preview = document.getElementById("preview")
      preview.hidden = false
      preview.innerHTML = ""
      for (const face of ["Front", "Back"]) {
        const card = document.createElement("div")
        card.className = "card"
        card.style.aspectRatio = spec.w + " / " + spec.h
        card.innerHTML = "<span>" + face + "</span>"
        const inset = (spec.trim / spec.w) * 100
        const trim = document.createElement("div")
        trim.className = "guide"
        trim.style.left = inset + "%"
        trim.style.top = (spec.trim / spec.h) * 100 + "%"
        trim.style.width = (100 - inset * 2) + "%"
        trim.style.height = (100 - (spec.trim / spec.h) * 100 * 2) + "%"
        card.appendChild(trim)
        if (face === "Back") {
          const pagePtW = spec.w * 72
          const pagePtH = spec.h * 72
          const hold = document.createElement("div")
          hold.className = "hold"
          hold.textContent = "Address"
          hold.style.width = (spec.panel[0] / pagePtW) * 100 + "%"
          hold.style.height = (spec.panel[1] / pagePtH) * 100 + "%"
          hold.style.right = (0.25 * 72 / pagePtW) * 100 + "%"
          hold.style.bottom = (0.25 * 72 / pagePtH) * 100 + "%"
          card.appendChild(hold)
        }
        preview.appendChild(card)
      }
    }
    document.getElementById("send").onclick = () => {
      parent.postMessage({ pluginMessage: { type: "check" } }, "*")
      const spec = SIZES[document.getElementById("size").value]
      const label = spec.w === 8.5 ? "8.5 × 5.5 in" : "9.5 × 6.5 in"
      status.textContent = "Page size is " + label + " with 0.25 in bleed. Guides are left out of the print file."
    }
    window.onmessage = async (event) => {
      const message = event.data.pluginMessage
      if (!message) return
      if (message.type === "created") status.textContent = "Front and back are ready. Guides stay off the printed file."
      if (message.type === "warnings") {
        if (message.warnings.length) {
          status.textContent = message.warnings.join(" ")
          status.className = "warn"
          return
        }
        parent.postMessage({ pluginMessage: { type: "export" } }, "*")
      }
      if (message.type === "files") await upload(message.files)
    }
    const origin = "https://test-next-modern-mail2.vercel.app"
    async function loadCampaigns() {
      const token = document.getElementById("token").value.trim()
      if (!token) {
        status.textContent = "Paste a token from Modern Mail settings."
        return
      }
      const listed = await fetch(origin + "/api/design-plugins/campaigns", {
        headers: { Authorization: "Bearer " + token },
      })
      const body = await listed.json()
      if (!listed.ok) {
        status.textContent = body.error || "The campaigns could not be loaded."
        return
      }
      const select = document.getElementById("campaign")
      select.innerHTML = '<option value="">New campaign</option>'
      for (const item of body.campaigns || []) {
        const option = document.createElement("option")
        option.value = item.id
        option.textContent = item.name
        select.appendChild(option)
      }
      status.textContent = "Choose a campaign, or leave New campaign selected."
    }
    async function upload(files) {
      const token = document.getElementById("token").value.trim()
      if (!token) {
        status.textContent = "Paste a token from Modern Mail settings."
        return
      }
      const headers = { Authorization: "Bearer " + token, "Content-Type": "application/json" }
      let campaignId = document.getElementById("campaign").value
      if (!campaignId) {
        const created = await fetch(origin + "/api/design-plugins/campaigns", {
          method: "POST",
          headers,
          body: JSON.stringify({
            name: document.getElementById("name").value,
            size: document.getElementById("size").value,
            brief: "A postcard designed for Modern Mail.",
          }),
        })
        const campaign = await created.json()
        if (!created.ok) {
          status.textContent = campaign.error || "The mailer was not created."
          return
        }
        campaignId = campaign.id
      }
      const address = {
        businessName: document.getElementById("business").value,
        street: document.getElementById("street").value,
        city: document.getElementById("city").value,
        state: document.getElementById("state").value,
        postalCode: document.getElementById("zip").value,
      }
      for (const file of files) {
        const sent = await fetch(origin + "/api/design-plugins/upload", {
          method: "POST",
          headers,
          body: JSON.stringify({ campaignId, ...file, ...address }),
        })
        const body = await sent.json()
        if (!sent.ok) {
          status.textContent = body.error || "The file was not accepted."
          return
        }
        if (body.issues && body.issues.length) {
          status.textContent = body.issues.map((item) => item.message).join(" ")
          status.className = "warn"
          return
        }
      }
      status.textContent = "Sent to Modern Mail. Open the campaign to approve the proof and the full price. Nothing is mailed yet."
    }
  </script>
</body>
</html>
